# AGP 9 built-in Kotlin: no kotlin-android plugin on the modules; the KGP
# 2.4.10 on the build classpath (via :common's kotlin-jvm) overrides the
# AGP-bundled Kotlin version.
android.useAndroidX=true

org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.configuration-cache=true
kotlin.code.style=official
